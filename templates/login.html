<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — Noon Financial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #1a1f2e 0%, #1a3a5c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .brand-logo {
      width: 48px; height: 48px;
      background: #185FA5;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: #fff;
      margin: 0 auto 12px;
    }
    .brand-title { font-size: 1.3rem; font-weight: 700; color: #1a1f2e; }
    .brand-sub   { font-size: .82rem; color: #6c757d; }
    .form-label  { font-size: .85rem; font-weight: 600; color: #374151; }
    .form-control {
      border-radius: 8px; font-family: 'Tajawal', sans-serif;
      font-size: .95rem; padding: .6rem .9rem;
    }
    .form-control:focus { border-color: #185FA5; box-shadow: 0 0 0 3px rgba(24,95,165,.15); }
    .btn-login {
      background: #185FA5; color: #fff; border: none;
      border-radius: 8px; padding: .7rem 1rem;
      font-size: 1rem; font-weight: 700;
      font-family: 'Tajawal', sans-serif;
      transition: background .15s;
    }
    .btn-login:hover { background: #1a4f8a; color: #fff; }
    .default-note {
      background: #fff3cd; border: 1px solid #ffeeba;
      border-radius: 8px; padding: 10px 14px;
      font-size: .8rem; color: #856404;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brand-logo">
        <i class="bi bi-bar-chart-fill"></i>
      </div>
      <div class="brand-title">نون المالية</div>
      <div class="brand-sub">Noon Financial</div>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small mb-3 text-center">
      <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login">
      <div class="mb-3">
        <label class="form-label" for="username">اسم المستخدم</label>
        <input type="text" id="username" name="username" class="form-control"
               placeholder="أدخل اسم المستخدم" autocomplete="username"
               value="{{ request.form.get('username', '') }}" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-login w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>تسجيل الدخول
      </button>
    </form>

    <div class="default-note mt-4 text-center">
      <i class="bi bi-shield-exclamation me-1"></i>
      بيانات الدخول الافتراضية: <strong>admin / admin123</strong><br>
      يُرجى تغيير كلمة المرور بعد أول دخول
    </div>
  </div>
</body>
</html>
