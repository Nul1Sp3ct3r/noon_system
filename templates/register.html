<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب — Noon Financial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #1a1f2e 0%, #1a3a5c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .register-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .brand-logo {
      width: 48px; height: 48px;
      background: #185FA5;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: #fff;
      margin: 0 auto 12px;
    }
    .brand-title { font-size: 1.3rem; font-weight: 700; color: #1a1f2e; }
    .brand-sub   { font-size: .82rem; color: #6c757d; }
    .form-label  { font-size: .85rem; font-weight: 600; color: #374151; }
    .form-control {
      border-radius: 8px; font-family: 'Tajawal', sans-serif;
      font-size: .95rem; padding: .6rem .9rem;
    }
    .form-control:focus { border-color: #185FA5; box-shadow: 0 0 0 3px rgba(24,95,165,.15); }
    .btn-register {
      background: #185FA5; color: #fff; border: none;
      border-radius: 8px; padding: .7rem 1rem;
      font-size: 1rem; font-weight: 700;
      font-family: 'Tajawal', sans-serif;
      transition: background .15s;
    }
    .btn-register:hover { background: #1a4f8a; color: #fff; }
    .login-link { font-size: .85rem; color: #6c757d; text-align: center; margin-top: 16px; }
    .login-link a { color: #185FA5; text-decoration: none; font-weight: 600; }
    .login-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="register-card">
    <div class="text-center mb-4">
      <div class="brand-logo">
        <i class="bi bi-bar-chart-fill"></i>
      </div>
      <div class="brand-title">نون المالية</div>
      <div class="brand-sub">إنشاء حساب جديد</div>
    </div>

    {% if success %}
    <div class="alert alert-success py-2 small mb-3 text-center">
      <i class="bi bi-check-circle me-1"></i>{{ success }}
    </div>
    {% endif %}

    {% if error %}
    <div class="alert alert-danger py-2 small mb-3 text-center">
      <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
    </div>
    {% endif %}

    {% if not success %}
    <form method="post" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="full_name">الاسم الكامل</label>
        <input type="text" id="full_name" name="full_name" class="form-control"
               placeholder="أدخل اسمك الكامل" autocomplete="name"
               value="{{ request.form.get('full_name', '') }}" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="username">اسم المستخدم</label>
        <input type="text" id="username" name="username" class="form-control"
               placeholder="أدخل اسم المستخدم" autocomplete="username"
               value="{{ request.form.get('username', '') }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="6 أحرف على الأقل" autocomplete="new-password" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="confirm_password">تأكيد كلمة المرور</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control"
               placeholder="أعد إدخال كلمة المرور" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-register w-100">
        <i class="bi bi-person-plus me-2"></i>إنشاء الحساب
      </button>
    </form>
    {% endif %}

    <div class="login-link">
      لديك حساب بالفعل؟ <a href="/login">تسجيل الدخول</a>
    </div>
  </div>
</body>
</html>
